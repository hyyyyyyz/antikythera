name: Refresh calendar
on:
  schedule:
    - cron: "19 3 * * *"
  push:
    branches: [main]
    paths: ['*.py', 'action.yml', '.github/workflows/calendar.yml']
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: calendar-publisher
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./
        with:
          output: gallery/assembly-log.svg
      - name: Publish the calendar
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- gallery/assembly-log.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh the public commit calendar'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
