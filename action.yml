name: Antikythera Commit Calendar
description: Render a wheeled Franka Panda shuttle that collects and returns public GitHub commit tiles.
author: Jason Huang
branding:
  icon: cpu
  color: yellow
inputs:
  username:
    description: GitHub login to render. Defaults to the repository owner.
    required: false
  token:
    description: Token for reading GitHub GraphQL. Defaults to the workflow token.
    required: false
    default: ${{ github.token }}
  output:
    description: SVG path relative to the caller's working directory.
    required: false
    default: assembly-log.svg
  compact-output:
    description: Optional second destination for the same single-strip SVG.
    required: false
runs:
  using: composite
  steps:
    - name: Render assembly log
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CALENDAR_USER: ${{ inputs.username }}
        CALENDAR_OUTPUT: ${{ inputs.output }}
        COMPACT_OUTPUT: ${{ inputs.compact-output }}
      run: |
        args=(--username "${CALENDAR_USER:-$GITHUB_REPOSITORY_OWNER}" --output "$CALENDAR_OUTPUT")
        if [[ -n "$COMPACT_OUTPUT" ]]; then args+=(--compact-output "$COMPACT_OUTPUT"); fi
        python3 "$GITHUB_ACTION_PATH/assembly.py" "${args[@]}"
